services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: innova
      POSTGRES_PASSWORD: innova
      POSTGRES_DB: innova_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innova -d innova_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://innova:innova@db:5432/innova_ai
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    working_dir: /workspace
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace:ro
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://innova:innova@db:5432/innova_ai
      REDIS_URL: redis://redis:6379/0
      PYTHON_DOTENV_DISABLED: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: .
    command: >-
      celery -A app.worker.lead_delivery:celery_app worker
      --loglevel=INFO --concurrency=1 --queues=innova.lead_delivery
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://innova:innova@db:5432/innova_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  telegram-bot:
    build: .
    command: python -m app.channel.telegram_bot
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      INNOVA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
