name: Innova CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: innova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  VERCEL_CLI_VERSION: "65.16.0"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: innova
          POSTGRES_PASSWORD: innova
          POSTGRES_DB: innova_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U innova -d innova_ai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DEEPEVAL_DISABLE_DOTENV: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      DATABASE_URL: postgresql+asyncpg://innova:innova@localhost:5432/innova_ai_test
      TEST_DATABASE_URL: postgresql+asyncpg://innova:innova@localhost:5432/innova_ai_test
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: fake
      LEAD_DELIVERY_PROVIDER: disabled
      REDIS_URL: ""
      OPENROUTER_API_KEY: ""
      AMOCRM_ACCESS_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        run: uv run pytest -p pytest_asyncio.plugin -q

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Run chat interface tests
        run: |
          npm install --prefix /tmp/innova-demo-tests --no-save --no-audit --no-fund jsdom@26.1.0
          NODE_PATH=/tmp/innova-demo-tests/node_modules node --test tests/frontend/demo.test.cjs

  deploy-vercel:
    name: Deploy INNOVA
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PYTHON_DOTENV_DISABLED: "1"
      PUBLIC_DEMO: "1"
    steps:
      - name: Check out tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release tools
        run: |
          npm install --prefix /tmp/innova-vercel-tools --no-save --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"
          echo /tmp/innova-vercel-tools/node_modules/.bin >> "$GITHUB_PATH"
          uv sync --frozen --no-dev

      - name: Pull Vercel production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
          vercel pull --yes --environment=production

      - name: Build production function
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # shortcut: native build hangs in CLI 65.16.0; remove the JS runner after a verified fix.
        run: node /tmp/innova-vercel-tools/node_modules/@vercel/cli-support/dist/vc.js build --prod

      - name: Migrate and seed demo database
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMBEDDING_PROVIDER: openrouter
        run: |
          uv run --frozen --no-dev python - <<'PYTHON'
          import os
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.drivername == "postgresql+asyncpg", "Expected asyncpg URL"
          assert url.database == "innova", "Expected the dedicated application database"
          assert (url.host or "").endswith(".neon.tech"), "Expected Neon hostname"
          assert "-pooler." not in (url.host or ""), "Use the direct Neon endpoint"
          assert url.query.get("ssl") == "verify-full", "TLS verification is required"
          PYTHON
          uv run --frozen --no-dev alembic upgrade head
          uv run --frozen --no-dev python -m scripts.seed_knowledge docs/RAG/Agent_memory.txt

      - name: Stage production deployment
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain)"
          DEPLOYMENT_URL="$deployment_url" python - <<'PYTHON'
          import os
          from urllib.parse import urlsplit
          url = urlsplit(os.environ["DEPLOYMENT_URL"])
          assert url.scheme == "https" and (url.hostname or "").endswith(".vercel.app")
          assert url.netloc == url.hostname and not url.path and not url.query and not url.fragment
          PYTHON
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Check staged deployment without creating conversations
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: uv run --frozen --no-dev python -m scripts.verify_vercel "$DEPLOYMENT_URL"

      - name: Promote verified deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes
