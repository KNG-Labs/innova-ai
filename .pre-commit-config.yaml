repos:
  - repo: local
    hooks:
      - id: forbid-env-files
        name: Запрет рабочих env-файлов
        entry: Рабочие env-файлы не должны попадать в Git
        language: fail
        files: '(^|/)\.env($|\.(?!example$))'
      - id: uv-lock
        name: Проверка uv.lock
        entry: uv lock --check
        language: system
        files: '^(pyproject\.toml|uv\.lock)$'
        pass_filenames: false
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
        files: '^(app/|tests/|main\.py$)'
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
        files: '^(app/|tests/|main\.py$)'
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy app/ --ignore-missing-imports
        language: system
        files: '^(app/.*\.py|pyproject\.toml|uv\.lock)$'
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
