name: innova-ai-eval

services:
  eval-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: innova
      POSTGRES_PASSWORD: innova
      POSTGRES_DB: innova_ai_eval
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innova -d innova_ai_eval"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  eval-runner:
    build:
      context: .
      dockerfile: Dockerfile.eval
    user: "${EVAL_UID:-1000}:${EVAL_GID:-1000}"
    env_file: .env
    environment:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: postgresql+asyncpg://innova:innova@eval-db:5432/innova_ai_eval
      TEST_DATABASE_URL: postgresql+asyncpg://innova:innova@eval-db:5432/innova_ai_eval
      EVAL_DATABASE_URL: postgresql+asyncpg://innova:innova@eval-db:5432/innova_ai_eval
      LLM_PROVIDER: ag2
      EMBEDDING_PROVIDER: openrouter
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      EVAL_JEV_MODEL: ${EVAL_JEV_MODEL:-jev-latest}
      LANGFUSE_TRACING_ENABLED: "false"
      LEAD_DELIVERY_PROVIDER: disabled
      REDIS_URL: ""
    entrypoint: ["sh", "-c", "alembic upgrade head && exec python -m evals.run \"$$@\"", "--"]
    command: ["--limit", "5"]
    depends_on:
      eval-db:
        condition: service_healthy
    volumes:
      - ./docs/RAG:/app/docs/RAG:ro
      - ./evals/datasets:/app/evals/datasets:ro
      - ./evals/reports:/app/evals/reports
